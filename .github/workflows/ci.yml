name: Circa release gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: circa-rules-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: circa-rules-test
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: circa-rules-test.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "100000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:100000000000:web:ci"
      NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ci-placeholder
      RATE_LIMIT_HMAC_SECRET: ci-only-rate-limit-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve scanner report outside the source tree
        run: npm run ci:collect-security-report
      - name: Verify secret scanning left a clean checkout
        run: npm run check:clean -- "after Gitleaks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Verify dependency installation left a clean checkout
        run: npm run check:clean -- "after npm ci"
      - run: npm run audit:production
      - name: Typecheck source before generated artifacts exist
        run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:firestore
      - name: Verify validation left a clean checkout
        run: npm run check:clean -- "before production build"
      - run: npm run build
      - name: Verify production build left a clean checkout
        run: npm run check:clean -- "after production build"
      - run: npm run validate:artifact
      - run: npm run scan:artifact
      - run: npm run test:critical
