name: Release Firestore controls

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed main-branch commit SHA whose release gate passed
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-controls:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm run test:firestore
      - run: npx firebase-tools deploy --only firestore:rules,firestore:indexes --project "$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
