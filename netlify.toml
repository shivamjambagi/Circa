[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."circa-app"]
  included_files = ["dist/server/**", "dist/.openai/hosting.json"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/circa-app"
  status = 200
